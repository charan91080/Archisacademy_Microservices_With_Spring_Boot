apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  DDL_AUTO: "validate"
  PRODUCT_SERVICE_URL: "http://product-service:8081"
  USER_SERVICE_URL: "http://user-service:8082"
  ORDER_SERVICE_URL: "http://order-service:8083"
  PRODUCT_DB_URL: "jdbc:mysql://REPLACE_PRODUCT_RDS_ENDPOINT:3306/product_db"
  USER_DB_URL: "jdbc:mysql://REPLACE_USER_RDS_ENDPOINT:3306/user_db"
  ORDER_DB_URL: "jdbc:mysql://REPLACE_ORDER_RDS_ENDPOINT:3306/order_db"
