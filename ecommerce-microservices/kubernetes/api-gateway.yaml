apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels: {app: api-gateway}
  template:
    metadata:
      labels: {app: api-gateway}
    spec:
      containers:
        - name: api-gateway
          image: YOUR_ECR_REGISTRY/api-gateway:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: PRODUCT_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: ecommerce-config, key: PRODUCT_SERVICE_URL}}
            - name: USER_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: ecommerce-config, key: USER_SERVICE_URL}}
            - name: ORDER_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: ecommerce-config, key: ORDER_SERVICE_URL}}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
          livenessProbe:
            httpGet: {path: /actuator/health, port: 8080}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  type: LoadBalancer
  selector: {app: api-gateway}
  ports:
    - port: 80
      targetPort: 8080
