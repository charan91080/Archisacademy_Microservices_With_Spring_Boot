server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:shop}
    password: ${DB_PASSWORD:local_only_password}
  jpa.hibernate.ddl-auto: ${DDL_AUTO:update}
  jpa.open-in-view: false
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true
