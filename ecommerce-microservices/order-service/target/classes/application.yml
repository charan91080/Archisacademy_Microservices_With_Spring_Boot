server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3309/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:shop}
    password: ${DB_PASSWORD:local_only_password}
  jpa.hibernate.ddl-auto: ${DDL_AUTO:update}
  jpa.open-in-view: false
services.product.base-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true
